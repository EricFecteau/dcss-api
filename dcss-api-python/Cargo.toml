[package]
authors = ["Eric Fecteau <eric.m.fecteau@gmail.com>"]
name = "dcss-api"
version = "0.4.0"
edition = "2024"
license = "MPL-2.0"
description = "A DCSS Webtile API for Python."
repository = "https://github.com/EricFecteau/dcss-api/"
readme = "README.md"

[lib]
name = "dcss_api"
crate-type = ["cdylib"]
doctest = false

[dependencies]
dcss-api = "0.4"
dcss-scenario-builder = "0.4"
pyo3 = { version = "0.26", features = ["extension-module"] }
serde_json = "1.0"